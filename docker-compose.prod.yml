services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: bybelt-chat:latest
    container_name: bybelt-chat
    restart: unless-stopped
    # Phase 25: allow the background-job drain (JOB_SHUTDOWN_DRAIN_MS, default
    # 25s) to complete before Docker sends SIGKILL. Must exceed the drain window
    # + grace (25s + 2s). Without this, Docker's default 10s stop timeout would
    # kill the process mid-drain.
    stop_grace_period: 30s
    ports:
      - "3004:3000"
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bybelt_internal

networks:
  bybelt_internal:
    name: bybelt_internal
    driver: bridge
