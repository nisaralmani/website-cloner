# Bybelt Chat — Shopify app (Crisp-style live chat + ecommerce context)
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "beb2152e9e090282cc27329b0defa928"
name = "Bybelt Live Chat"
handle = "bybelt-live-chat"
application_url = "https://chat.bybelt.com/initiate/plugin/shopify"
embedded = false

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://chat.bybelt.com/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "https://chat.bybelt.com/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["customers/create"]
  uri = "https://chat.bybelt.com/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = ["customers/update"]
  uri = "https://chat.bybelt.com/webhooks/customers/update"

  [[webhooks.subscriptions]]
  topics = ["customers/delete"]
  uri = "https://chat.bybelt.com/webhooks/customers/delete"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://chat.bybelt.com/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "https://chat.bybelt.com/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "https://chat.bybelt.com/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "https://chat.bybelt.com/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "https://chat.bybelt.com/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = ["fulfillments/create"]
  uri = "https://chat.bybelt.com/webhooks/fulfillments/create"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "https://chat.bybelt.com/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "https://chat.bybelt.com/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "https://chat.bybelt.com/webhooks/shop/redact"

[access_scopes]
scopes = "read_customers,read_orders,read_products,read_content,read_themes,read_fulfillments"

[auth]
redirect_urls = [
  "https://chat.bybelt.com/auth/callback",
  "https://chat.bybelt.com/auth/shopify/callback",
]

[shop.metafields.bybelt.workspace_id]
type = "single_line_text_field"
name = "Bybelt workspace ID"
description = "Bybelt workspace / website ID for the chat widget"

  [shop.metafields.bybelt.workspace_id.access]
  admin = "merchant_read_write"

[shop.metafields.bybelt.domain]
type = "single_line_text_field"
name = "Bybelt domain"
description = "Workspace domain used by the Bybelt chatbox"

  [shop.metafields.bybelt.domain.access]
  admin = "merchant_read_write"

[shop.metafields.bybelt.widget_enabled]
type = "boolean"
name = "Chat widget enabled"
description = "When false, the storefront chat widget is hidden"

  [shop.metafields.bybelt.widget_enabled.access]
  admin = "merchant_read_write"
